name: Daily Apartment Subscription Check

on:
  schedule:
    # 매일 한국시간(KST, UTC+9) 오전 10시 = UTC 당일 01:00
    # (오전 8시에서 늦춘 이유: 청약 공고가 9시 이후에 올라오는 경우가 있어서.
    #  부수 효과로 UTC 날짜와 KST 날짜가 같은 달력일이 되어, notifier.py의
    #  date.today()가 KST 기준 "오늘"과 어긋나지 않게 됨 - 예전 08:00 KST 스케줄은
    #  UTC로는 전날 23:00이라 date.today()가 하루 전 날짜를 반환했었음)
    - cron: '0 1 * * *'
  workflow_dispatch: {}  # 필요할 때 수동으로도 실행 가능 (Actions 탭에서 Run workflow)

permissions:
  contents: write  # seen_notices.json을 커밋해서 "이미 알림 보낸 공고" 상태를 유지하기 위함

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run subscription check
        env:
          CHEONGYAK_SERVICE_KEY: ${{ secrets.CHEONGYAK_SERVICE_KEY }}
          RTMS_SERVICE_KEY: ${{ secrets.RTMS_SERVICE_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
          MY_PROFILE_JSON: ${{ secrets.MY_PROFILE_JSON }}
        run: python src/main.py

      - name: Upload run log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: run_log.jsonl
          retention-days: 14
          if-no-files-found: ignore

      - name: Persist "seen notices" state
        if: always()
        run: |
          if [ -f seen_notices.json ] && [ -n "$(git status --porcelain seen_notices.json)" ]; then
            git config user.name "apt-subscription-bot"
            git config user.email "actions@users.noreply.github.com"
            git add seen_notices.json
            git commit -m "chore: update seen notices [skip ci]"
            git push
          else
            echo "변경 없음, 커밋 스킵"
          fi